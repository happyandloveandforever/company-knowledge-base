<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" xml:lang="zh-CN">
  <title>环境刺激限制后，交感空转下降，迷走神经接手窗口</title>
  <desc>自主神经双向调节：交感是油门，迷走是刹车。限制外界刺激后交感空转下降，出现窗口让迷走接手。</desc>
  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E8EEF7"/>
    </marker>
  </defs>
  <style>
    .cn { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif; }
  </style>
  <text class="cn" x="640" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#F7FBFF">通过限制环境刺激，降低交感空转，给迷走一个接手的窗口</text>
  <text class="cn" x="640" y="66" text-anchor="middle" font-size="14" fill="#C5D4E8">不是把恢复灌进去 · 是拿掉外界功课，让刹车重新咬住</text>
  <g class="cn">
    <rect x="268" y="86" width="216" height="44" rx="22" fill="#1D4E89" stroke="#8EC5FF" stroke-width="1.5"/>
    <text x="376" y="114" text-anchor="middle" font-size="15" fill="#F3F9FF">浮力 · 少抗重力</text>
    <rect x="532" y="86" width="216" height="44" rx="22" fill="#1D4E89" stroke="#8EC5FF" stroke-width="1.5"/>
    <text x="640" y="114" text-anchor="middle" font-size="15" fill="#F3F9FF">恒温 · 少冷热报警</text>
    <rect x="796" y="86" width="216" height="44" rx="22" fill="#1D4E89" stroke="#8EC5FF" stroke-width="1.5"/>
    <text x="904" y="114" text-anchor="middle" font-size="15" fill="#F3F9FF">低声 · 少威胁扫描</text>
  </g>
  <path d="M640 130 L640 154" stroke="#E8EEF7" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  <g class="cn">
    <rect x="40" y="168" width="270" height="220" rx="18" fill="#1B4F86" stroke="#9AD0FF" stroke-width="2"/>
    <circle cx="70" cy="200" r="16" fill="#9AD0FF"/>
    <text x="70" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#0E2A4A">1</text>
    <text x="175" y="208" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">限制环境刺激</text>
    <text x="175" y="240" text-anchor="middle" font-size="13" fill="#C9E4FF">REST · 减少外界传入</text>
    <text x="175" y="280" text-anchor="middle" font-size="15" fill="#F4FAFF">大脑少为外面做事</text>
    <text x="175" y="306" text-anchor="middle" font-size="15" fill="#F4FAFF">中枢暂时不必应答</text>
    <text x="175" y="356" text-anchor="middle" font-size="12" fill="#B9D6F3">医学：降低外感受负荷</text>
    <path d="M318 278 L350 278" stroke="#E8EEF7" stroke-width="3.5" marker-end="url(#arrowHead)"/>
    <rect x="360" y="168" width="270" height="220" rx="18" fill="#9A3412" stroke="#FDBA74" stroke-width="2"/>
    <circle cx="390" cy="200" r="16" fill="#FDBA74"/>
    <text x="390" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#7C2D12">2</text>
    <text x="495" y="208" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF7ED">交感空转下降</text>
    <text x="495" y="240" text-anchor="middle" font-size="13" fill="#FED7AA">油门少空踩</text>
    <text x="495" y="280" text-anchor="middle" font-size="15" fill="#FFF7ED">少扫描 · 少备战</text>
    <text x="495" y="306" text-anchor="middle" font-size="15" fill="#FFF7ED">打仗档不必一直开</text>
    <text x="495" y="356" text-anchor="middle" font-size="12" fill="#FEC89A">医学：交感相对下调</text>
    <path d="M638 278 L670 278" stroke="#E8EEF7" stroke-width="3.5" marker-end="url(#arrowHead)"/>
    <rect x="680" y="168" width="270" height="220" rx="18" fill="#854D0E" stroke="#FBBF24" stroke-width="3" stroke-dasharray="9 6"/>
    <circle cx="710" cy="200" r="16" fill="#FBBF24"/>
    <text x="710" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#78350F">3</text>
    <text x="815" y="208" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFBEB">接手窗口</text>
    <text x="815" y="240" text-anchor="middle" font-size="13" fill="#FDE68A">警报暂时安静</text>
    <text x="815" y="280" text-anchor="middle" font-size="15" fill="#FFFBEB">切换条件具备</text>
    <text x="815" y="306" text-anchor="middle" font-size="15" fill="#FFFBEB">刹车终于有空档</text>
    <text x="815" y="356" text-anchor="middle" font-size="12" fill="#FCD34D">一次窗口 ≠ 永久修好</text>
    <path d="M958 278 L990 278" stroke="#E8EEF7" stroke-width="3.5" marker-end="url(#arrowHead)"/>
    <rect x="1000" y="168" width="240" height="220" rx="18" fill="#0F766E" stroke="#5EEAD4" stroke-width="2"/>
    <circle cx="1028" cy="200" r="16" fill="#5EEAD4"/>
    <text x="1028" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#134E4A">4</text>
    <text x="1120" y="208" text-anchor="middle" font-size="18" font-weight="700" fill="#F0FDFA">迷走接手</text>
    <text x="1120" y="240" text-anchor="middle" font-size="13" fill="#99F6E4">刹车咬住</text>
    <text x="1120" y="280" text-anchor="middle" font-size="15" fill="#F0FDFA">切到休息 · 修复档</text>
    <text x="1120" y="306" text-anchor="middle" font-size="15" fill="#F0FDFA">心跳消化睡眠让路</text>
    <text x="1120" y="356" text-anchor="middle" font-size="12" fill="#5EEAD4">医学：副交感相对占优</text>
  </g>
  <g class="cn">
    <text x="40" y="430" font-size="13" font-weight="700" fill="#FDBA74">交感 · 油门</text>
    <rect x="148" y="414" width="1092" height="20" rx="10" fill="#431407" stroke="#FDBA74" stroke-width="1"/>
    <rect x="148" y="414" width="532" height="20" rx="10" fill="#FB923C"/>
    <rect x="670" y="414" width="80" height="20" fill="#FB923C" opacity="0.35"/>
    <text x="1240" y="429" text-anchor="end" font-size="12" fill="#FED7AA">空转下降</text>
    <text x="40" y="468" font-size="13" font-weight="700" fill="#5EEAD4">迷走 · 刹车</text>
    <rect x="148" y="452" width="1092" height="20" rx="10" fill="#042F2E" stroke="#5EEAD4" stroke-width="1"/>
    <rect x="680" y="452" width="560" height="20" rx="10" fill="#2DD4BF"/>
    <text x="1240" y="467" text-anchor="end" font-size="12" fill="#99F6E4">开始接手</text>
    <rect x="680" y="404" width="270" height="78" rx="12" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="6 4"/>
  </g>
  <g class="cn">
    <rect x="40" y="500" width="1200" height="116" rx="16" fill="#1E3A5F" stroke="#7DD3FC" stroke-width="1.5"/>
    <text x="640" y="534" text-anchor="middle" font-size="16" font-weight="700" fill="#F0F9FF">医学怎么解释（给非医学同事）</text>
    <text x="640" y="564" text-anchor="middle" font-size="14" fill="#E0F2FE">身体有两套自动挡：交感负责打仗和赶工，迷走负责休息、消化、睡觉。它们通常此消彼长。</text>
    <text x="640" y="588" text-anchor="middle" font-size="14" fill="#E0F2FE">漂浮把外界刺激降下来，等于先让打仗那套少空转，休息那套才有机会接手。这是再平衡，不是把神经关掉。</text>
  </g>
</svg>
