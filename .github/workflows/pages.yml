name: Verify public HTML

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build static HTML
        run: node scripts/export-public-site.mjs
      - name: Check baked pages
        run: |
          test -s docs/vagus.html
          test -s docs/index.html
          grep -q "KP-VGMECH-001" docs/vagus.html
          grep -q "<article" docs/index.html
          python3 - <<'PY'
          from pathlib import Path
          vagus = Path("docs/vagus.html").read_text()
          index = Path("docs/index.html").read_text()
          assert "正在加载" not in vagus
          assert vagus.count("<article") >= 50
          assert index.count("<article") >= 400
          print("vagus articles", vagus.count("<article"))
          print("index articles", index.count("<article"))
          PY
